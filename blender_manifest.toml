schema_version = "1.0.0"

id = "tissue"
version = "0.3.76"
name = "Tissue"
tagline = "Tools for Computational Design"
maintainer = "Alessandro Zomparelli"
type = "add-on"

blender_version_min = "4.5.0"

license = [
	"SPDX:GPL-3.0-or-later",
]

website = "https://github.com/alessandro-zomparelli/tissue/tree/master/docs"
tracker_url = "https://github.com/alessandro-zomparelli/tissue/issues"

[build]
paths_exclude_pattern = [
	"__pycache__/",
	"/.git/",
	"/.gitattributes",
	"/*.zip",
	"/docs/",
	"/tests/",
	"/.github/",
]
